<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- title here -->

    <title>Fifa World Cup</title>
    <!-- css link here -->
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <!--header section start  -->
    <header class="header container">
      <div class="left-header">
        <img src="./images/Frame 1000002866.png" alt="logo" />
      </div>
      <div class="middle-header">
        <nav>
          <ul>
            <li><a href="#">Tournament</a></li>
            <li><a href="#">Host Cities</a></li>
            <li><a href="#">Groups</a></li>
            <li><a href="#">Schedule</a></li>
            <li><a href="#">News</a></li>
          </ul>
        </nav>
      </div>
      <div class="right-header">
        <button>Buy Tickets</button>
      </div>
    </header>
    <!-- header section end -->
    <!-- main section start here -->
    <main>
      <!-- banner section start -->
      <section class="banner container">
        <div class="banner-content">
          <h2>One Game. <br> 48 Nations. <br> One World.</h2>
        <p>
          Witness history in the making as the world’s biggest football <br>
          tournament scales to unprecedented heights. Secure your <br> place in the
          stands today.
        </p>
        <div class="banner-btn">
          <button>Book Tickets Now</button>
        </div>
        </div>
      </section>
      <!-- banner section end -->
    </main>
    <!-- main section end here -->
  </body>
</html>
